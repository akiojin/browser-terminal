[package]
name = "browser-terminal"
version = "0.1.0"
edition = "2021"
description = "A tiny local web terminal: operate a real shell on your machine from a browser tab"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
futures-util = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
opt-level = 3
